const QD_SCHAAL_MOEITE = ["Geen moeite","Weinig moeite","Redelijke moeite","Veel moeite","Niet mogelijk"];

];

let spadiPijn = new Array(5).fill(null);
let spadiBeperking = new Array(8).fill(null);
let qbpds = new Array(20).fill(null);
let ndi = new Array(10).fill(null);
let quickdash = new Array(11).fill(null);

function toonScherm(id) {
  document.querySelectorAll('.scherm').forEach(s => s.classList.remove('actief'));
  document.getElementById('scherm-' + id).classList.add('actief');
}

async function init() {
  // Haal code uit URL
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');

  if (!code || code.length !== 4) {
    toonScherm('fout');
    return;
  }

  document.getElementById('code-badge').textContent = code;

  // Zoek verzoek in Supabase
  try {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/vragenlijsten?code=eq.${code}&type=eq.verzoek&ingevoerd=eq.false`,
      {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
        }
      }
    );
    const data = await response.json();

    if (!data || data.length === 0) {
      toonScherm('fout');
      return;
    }

    verzoekData = data[0];
    bouwVragenlijst();
    toonScherm('vragenlijst');

  } catch(e) {
    toonScherm('fout');
  }
}

function bouwVragenlijst() {

  const lijst = verzoekData.vragenlijst;

  if (lijst === 'SPADI') {
    container.innerHTML = `
      <h2>SPADI — Schouder vragenlijst</h2>
      <p class="info">Met deze vragenlijst wordt de mate van pijn van uw schouder en de ondervonden beperkingen gedurende de <strong>afgelopen week</strong> in kaart gebracht.</p>
    `;
    const sectie1 = maakSectie('Pijn schaal', 'Hoe erg is uw pijn? <strong>0 = geen pijn</strong> en <strong>10 = ergst bedenkbare pijn</strong>');
    SPADI_PIJN.forEach((v, i) => sectie1.appendChild(maakSlider(v, 'pijn', i)));
    container.appendChild(sectie1);

    const sectie2 = maakSectie('Beperking schaal', 'Hoeveel moeite heeft u? <strong>0 = geen enkele moeite</strong> en <strong>10 = zo moeilijk dat hulp nodig is</strong>');
    SPADI_BEPERKING.forEach((v, i) => sectie2.appendChild(maakSlider(v, 'beperking', i)));
    container.appendChild(sectie2);

  } else if (lijst === 'QBPDS') {
    container.innerHTML = `
      <h2>QBPDS — Rug vragenlijst</h2>
      <p class="info">Onderstaande vragenlijst gaat over de manier waarop uw rugklachten uw dagelijks leven beïnvloeden.</p>
    `;
    QBPDS_VRAGEN.forEach((v, i) => container.appendChild(maakRadio(i + 1, v, QBPDS_LABELS, ndiSetter('qbpds', i))));

  } else if (lijst === 'NDI') {
    container.innerHTML = `
      <h2>NDI — Nek vragenlijst</h2>
      <p class="info">Met deze vragenlijst willen wij een indruk krijgen van de beperkingen die u ondervindt in het dagelijks leven ten gevolge van <strong>nekklachten</strong>. Kruis bij elke vraag het antwoord aan dat het meest uw situatie weergeeft.</p>
    `;
    NDI_VRAGEN.forEach((vraag, i) => {
      const label = `<strong>${vraag.titel}</strong>`;
      container.appendChild(maakRadioVerticaal(i + 1, label, vraag.opties, ndiSetter('ndi', i)));
    });

  } else if (lijst === 'QuickDASH') {
    container.innerHTML = `
      <h2>QuickDASH — Arm, schouder & hand</h2>
      <p class="info">Deze vragenlijst gaat over uw klachten en uw mogelijkheid om activiteiten uit te voeren. Beantwoord elke vraag zoals u zich de <strong>afgelopen week</strong> heeft gevoeld.</p>
    `;
    QUICKDASH_VRAGEN.forEach((vraag, i) => {
      container.appendChild(maakRadio(i + 1, vraag.label, vraag.schaal, ndiSetter('quickdash', i)));
    });

  } else {
    // Onbekend type: toon fout in plaats van stilzwijgend de verkeerde lijst
    container.innerHTML = `
      <h2>Onbekende vragenlijst</h2>

    `;
    document.getElementById('verzend-knop').style.display = 'none';
  }
}

// Kiest de juiste state-array om de score in weg te schrijven
function ndiSetter(welke, index) {
  return (waarde) => {
    if (welke === 'qbpds') qbpds[index] = waarde;
    else if (welke === 'ndi') ndi[index] = waarde;
    else if (welke === 'quickdash') quickdash[index] = waarde;
    checkVerzenden();
  };
}

function maakSectie(titel, info) {
  const div = document.createElement('div');
  div.className = 'sectie';
  div.innerHTML = `<div class="sectie-header">${titel}</div><p class="sectie-info">${info}</p>`;
  return div;
}

function maakSlider(label, dataArray, index) {
  const div = document.createElement('div');
  div.className = 'vraag-blok';
  div.innerHTML = `
    <div class="vraag-label">${label}</div>
    <div class="slider-rij">
      <span class="slider-min">0</span>
      <input type="range" min="0" max="10" step="1" value="5" class="frm-slider">
      <span class="slider-max">10</span>
      <div class="slider-waarde">—</div>
    </div>`;

  const slider = div.querySelector('.frm-slider');
  const waardeEl = div.querySelector('.slider-waarde');

  const update = () => {
    const v = Number(slider.value);
    if (dataArray === 'pijn') spadiPijn[index] = v;
    else spadiBeperking[index] = v;
    waardeEl.className = 'slider-waarde ingevuld';
    waardeEl.textContent = v;
    checkVerzenden();
  };

  slider.addEventListener('mousedown', update);
  slider.addEventListener('touchstart', update);
  slider.addEventListener('input', update);
  return div;
}

// Horizontale knoppenrij — voor korte optieteksten (QBPDS, QuickDASH)
function maakRadio(nummer, label, optieLabels, setter) {
  const div = document.createElement('div');
  div.className = 'radio-blok';
  div.innerHTML = `<div class="radio-label"><span class="radio-nummer">${nummer}.</span> ${label}</div>`;
  const opties = document.createElement('div');
  opties.className = 'radio-opties';

  optieLabels.forEach((tekst, i) => {
    const knop = document.createElement('button');
    knop.className = 'radio-knop';
    knop.innerHTML = `<span class="radio-score">${i}</span><span class="radio-tekst">${tekst}</span>`;
    knop.onclick = () => {
      setter(i);
      opties.querySelectorAll('.radio-knop').forEach(k => k.classList.remove('actief'));
      knop.classList.add('actief');
    };
    opties.appendChild(knop);
  });
  div.appendChild(opties);
  return div;
}

// Verticale lijst — voor lange optieteksten (NDI: hele zinnen per antwoord)
function maakRadioVerticaal(nummer, label, optieLabels, setter) {
  const div = document.createElement('div');
  div.className = 'radio-blok';
  div.innerHTML = `<div class="radio-label"><span class="radio-nummer">${nummer}.</span> ${label}</div>`;
  const opties = document.createElement('div');
  opties.className = 'radio-opties-verticaal';

  optieLabels.forEach((tekst, i) => {
    const knop = document.createElement('button');
    knop.className = 'radio-knop-rij';
    knop.innerHTML = `<span class="radio-score-klein">${i}</span><span class="radio-tekst-links">${tekst}</span>`;
    knop.onclick = () => {
      setter(i);
      opties.querySelectorAll('.radio-knop-rij').forEach(k => k.classList.remove('actief'));
      knop.classList.add('actief');
    };
    opties.appendChild(knop);
  });
  div.appendChild(opties);
  return div;
}

function checkVerzenden() {
  let klaar = false;
  const lijst = verzoekData.vragenlijst;
  if (lijst === 'SPADI') {
    klaar = spadiPijn.every(v => v !== null) && spadiBeperking.every(v => v !== null);
  } else if (lijst === 'QBPDS') {
    klaar = qbpds.every(v => v !== null);
  } else if (lijst === 'NDI') {
    klaar = ndi.every(v => v !== null);
  } else if (lijst === 'QuickDASH') {
    klaar = quickdash.every(v => v !== null);
  }
  document.getElementById('verzend-knop').disabled = !klaar;
}

async function verzenden() {
  const knop = document.getElementById('verzend-knop');
  knop.disabled = true;
  knop.textContent = 'Bezig...';

  let scores;
  switch (verzoekData.vragenlijst) {
    case 'SPADI':     scores = { pijn: spadiPijn, beperking: spadiBeperking }; break;
    case 'QBPDS':     scores = { items: qbpds }; break;
    case 'NDI':       scores = { items: ndi }; break;
    case 'QuickDASH': scores = { items: quickdash }; break;
    default:          scores = { items: [] };
  }

  try {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/vragenlijsten?id=eq.${verzoekData.id}`,
      {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Prefer': 'return=minimal',
        },
        body: JSON.stringify({ scores, ingevuld_op: new Date().toISOString() }),
      }
    );

    if (!response.ok) throw new Error();
    toonScherm('dank');
    document.getElementById('progress').style.display = 'none';

  } catch(e) {
    const fout = document.getElementById('fout');
    fout.textContent = 'Er is iets misgegaan. Probeer het opnieuw.';
    fout.style.display = 'block';
    knop.disabled = false;
    knop.textContent = '✓ Verzenden';
  }
}

init();
</script>
