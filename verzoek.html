  { label: "Zwaar huishoudelijk werk (bijv. dweilen, stofzuigen)", schaal: KH_MOEITE },
  // Kwaliteit van leven
  { label: "Hoe vaak bent u zich bewust van uw heupprobleem?", schaal: KH_FREQ },
  { label: "Heeft u uw leefstijl aangepast om activiteiten te vermijden die schadelijk kunnen zijn voor uw heup?", schaal: KH_LIFESTYLE },
  { label: "In welke mate heeft u last van een gebrek aan vertrouwen in uw heup?", schaal: KH_VERTROUWEN },
  { label: "Hoeveel moeite heeft u in het algemeen met uw heup?", schaal: KH_EXTENT },
];

// INTAKE — vrije intakevragen (tekst, dropdown, radio). Geen scores.
const INTAKE_ZIJDE_OPTIES  = ["Links", "Rechts", "Beide zijden", "Niet van toepassing"];
const INTAKE_BELOOP_OPTIES = ["Toegenomen", "Afgenomen", "Niet gewijzigd", "Wisselend"];
const INTAKE_EENHEID_OPTIES = ["dag", "dagen", "week", "weken", "maand", "maanden", "jaar", "jaren"];

let verzoekData = null;
let verzoekWachtrij = [];   // alle verzoeken met deze code
let wachtrijIndex = 0;      // welk verzoek nu wordt ingevuld
let spadiPijn = new Array(5).fill(null);
let spadiBeperking = new Array(8).fill(null);
let qbpds = new Array(20).fill(null);
let ndi = new Array(10).fill(null);
let quickdash = new Array(11).fill(null);
let koos = new Array(12).fill(null);
let hoos = new Array(12).fill(null);
let intake = {
  klacht_beschrijving: "",   // vraag 1 → Stoornissen
  beperkingen: "",           // vraag 2 → Beperkingen
  zijde: "",                 // vraag 3 → Aangedane zijde (dropdown)
  duur_aantal: "",           // vraag 4 → deel van Sinds
  duur_eenheid: "",          // vraag 5 → deel van Sinds
  ontstaan: "",              // vraag 6 → Historie
  beloop: "",                // vraag 7 → Beloop (radio)
  doel: "",                  // vraag 8 → Patiëntbehoeften
};

function toonScherm(id) {
  document.querySelectorAll('.scherm').forEach(s => s.classList.remove('actief'));
  document.getElementById('scherm-' + id).classList.add('actief');
}

async function init() {
  // Haal code uit URL
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');

  if (!code || code.length !== 4) {
    toonScherm('fout');
    return;
  }

  document.getElementById('code-badge').textContent = code;

  // Zoek alle verzoeken met deze code in Supabase
  try {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/vragenlijsten?code=eq.${code}&type=eq.verzoek&ingevoerd=eq.false`,
      {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
        }
      }
    );
    const data = await response.json();

    if (!data || data.length === 0) {
      toonScherm('fout');
      return;
    }

    // Alleen verzoeken die nog niet ingevuld zijn (scores nog leeg)
    let openstaand = data.filter(r => r.scores === null);

    if (openstaand.length === 0) {
      // Alles al ingevuld → direct bedankt
      toonScherm('dank');
      document.getElementById('progress').style.display = 'none';
      return;
    }

    // Intake eerst, daarna de vragenlijsten
    openstaand.sort((a, b) => {
      if (a.vragenlijst === 'Intake') return -1;
      if (b.vragenlijst === 'Intake') return 1;
      return 0;
    });

    verzoekWachtrij = openstaand;
    wachtrijIndex = 0;
    laadHuidigVerzoek();

  } catch(e) {
    toonScherm('fout');
  }
}

// Laadt het verzoek waar we nu in de wachtrij staan
function laadHuidigVerzoek() {
  verzoekData = verzoekWachtrij[wachtrijIndex];

  // State resetten voor de nieuwe vragenlijst
  spadiPijn = new Array(5).fill(null);
  spadiBeperking = new Array(8).fill(null);
  qbpds = new Array(20).fill(null);
  ndi = new Array(10).fill(null);
  quickdash = new Array(11).fill(null);
  koos = new Array(12).fill(null);
  hoos = new Array(12).fill(null);
  intake = {
    klacht_beschrijving: "", beperkingen: "", zijde: "",
    duur_aantal: "", duur_eenheid: "", ontstaan: "", beloop: "", doel: "",
  };

  // Verzend-knop terugzetten
  const verzendKnop = document.getElementById('verzend-knop');
  verzendKnop.disabled = true;
  verzendKnop.style.display = '';
  verzendKnop.textContent = verzoekWachtrij.length > 1
    ? `✓ Verzenden (${wachtrijIndex + 1}/${verzoekWachtrij.length})`
    : '✓ Verzenden';

  bouwVragenlijst();
  toonScherm('vragenlijst');
  window.scrollTo(0, 0);
}

function bouwVragenlijst() {
  const container = document.getElementById('vragenlijst-container');
  container.innerHTML = '';

  const lijst = verzoekData.vragenlijst;

  if (lijst === 'SPADI') {
    container.innerHTML = `
      <h2>SPADI — Schouder vragenlijst</h2>
      <p class="info">Met deze vragenlijst wordt de mate van pijn van uw schouder en de ondervonden beperkingen gedurende de <strong>afgelopen week</strong> in kaart gebracht.</p>
    `;
    const sectie1 = maakSectie('Pijn schaal', 'Hoe erg is uw pijn? <strong>0 = geen pijn</strong> en <strong>10 = ergst bedenkbare pijn</strong>');
    SPADI_PIJN.forEach((v, i) => sectie1.appendChild(maakSlider(v, 'pijn', i)));
    container.appendChild(sectie1);

    const sectie2 = maakSectie('Beperking schaal', 'Hoeveel moeite heeft u? <strong>0 = geen enkele moeite</strong> en <strong>10 = zo moeilijk dat hulp nodig is</strong>');
    SPADI_BEPERKING.forEach((v, i) => sectie2.appendChild(maakSlider(v, 'beperking', i)));
    container.appendChild(sectie2);

  } else if (lijst === 'QBPDS') {
    container.innerHTML = `
      <h2>QBPDS — Rug vragenlijst</h2>
      <p class="info">Onderstaande vragenlijst gaat over de manier waarop uw rugklachten uw dagelijks leven beïnvloeden.</p>
    `;
    QBPDS_VRAGEN.forEach((v, i) => container.appendChild(maakRadio(i + 1, v, QBPDS_LABELS, ndiSetter('qbpds', i))));

  } else if (lijst === 'NDI') {
    container.innerHTML = `
      <h2>NDI — Nek vragenlijst</h2>
      <p class="info">Met deze vragenlijst willen wij een indruk krijgen van de beperkingen die u ondervindt in het dagelijks leven ten gevolge van <strong>nekklachten</strong>. Kruis bij elke vraag het antwoord aan dat het meest uw situatie weergeeft.</p>
    `;
    NDI_VRAGEN.forEach((vraag, i) => {
      const label = `<strong>${vraag.titel}</strong>`;
      container.appendChild(maakRadioVerticaal(i + 1, label, vraag.opties, ndiSetter('ndi', i)));
    });

  } else if (lijst === 'QuickDASH') {
    container.innerHTML = `
      <h2>QuickDASH — Arm, schouder & hand</h2>
      <p class="info">Deze vragenlijst gaat over uw klachten en uw mogelijkheid om activiteiten uit te voeren. Beantwoord elke vraag zoals u zich de <strong>afgelopen week</strong> heeft gevoeld.</p>
    `;
    QUICKDASH_VRAGEN.forEach((vraag, i) => {
      container.appendChild(maakRadio(i + 1, vraag.label, vraag.schaal, ndiSetter('quickdash', i)));
    });

  } else if (lijst === 'KOOS-12' || lijst === 'HOOS-12') {
    const isKnie = lijst === 'KOOS-12';
    const vragen = isKnie ? KOOS12_VRAGEN : HOOS12_VRAGEN;
    const gewricht = isKnie ? 'knie' : 'heup';
    container.innerHTML = `
      <h2>${lijst} — ${isKnie ? 'Knie' : 'Heup'} vragenlijst</h2>
      <p class="info">Deze vragenlijst gaat over uw ${gewricht} en hoe deze uw dagelijks leven beïnvloedt gedurende de <strong>afgelopen week</strong>. Kies bij elke vraag het antwoord dat het best bij u past.</p>
    `;
    const setterNaam = isKnie ? 'koos' : 'hoos';
    vragen.forEach((vraag, i) => {
      container.appendChild(maakRadio(i + 1, vraag.label, vraag.schaal, ndiSetter(setterNaam, i)));
    });

  } else if (lijst === 'Intake') {
    container.innerHTML = `
      <h2>Online Intake Vragenlijst</h2>
      <p class="info">Om uw behandeling goed voor te bereiden, vragen wij u onderstaande vragen zo volledig mogelijk te beantwoorden.</p>
    `;
    container.appendChild(maakTekstvraag(1,
      'Beschrijf de klacht(en) waarvoor u in behandeling komt',
      'klacht_beschrijving'));
    container.appendChild(maakTekstvraag(2,
      'Welke activiteiten kunt u hierdoor niet meer uitvoeren en/of in welke activiteiten wordt u door deze klachten gehinderd?',
      'beperkingen'));
    container.appendChild(maakDropdownvraag(3,
      'Aangedane zijde',
      INTAKE_ZIJDE_OPTIES, 'zijde'));
    container.appendChild(maakDuurVraag(4));
    container.appendChild(maakTekstvraag(6,
      'Kunt u aangeven hoe de klacht(en) is/zijn ontstaan?',
      'ontstaan'));
    container.appendChild(maakRadioTekstvraag(7,
      'Zijn de klachten sinds het ontstaan…',
      INTAKE_BELOOP_OPTIES, 'beloop'));
    container.appendChild(maakTekstvraag(8,
      'Wat wilt u weer bereiken en binnen welke termijn wilt u dit bereiken door fysiotherapeutische behandeling?',
      'doel'));

  } else {
    // Onbekend type: toon fout in plaats van stilzwijgend de verkeerde lijst
    container.innerHTML = `
      <h2>Onbekende vragenlijst</h2>
      <p class="info">Deze vragenlijst (${lijst || 'onbekend'}) kan niet worden weergegeven. Neem contact op met uw therapeut.</p>
    `;
    document.getElementById('verzend-knop').style.display = 'none';
  }
}

// Kiest de juiste state-array om de score in weg te schrijven
function ndiSetter(welke, index) {
  return (waarde) => {
    if (welke === 'qbpds') qbpds[index] = waarde;
    else if (welke === 'ndi') ndi[index] = waarde;
    else if (welke === 'quickdash') quickdash[index] = waarde;
    else if (welke === 'koos') koos[index] = waarde;
    else if (welke === 'hoos') hoos[index] = waarde;
    checkVerzenden();
  };
}

// ── Intake bouwstenen ────────────────────────────────
function maakTekstvraag(nummer, label, veld) {
  const div = document.createElement('div');
  div.className = 'vraag-blok';
  div.innerHTML = `<div class="vraag-label"><span class="radio-nummer">${nummer}.</span> ${label}</div>`;
  const ta = document.createElement('textarea');
  ta.className = 'intake-textarea';
  ta.rows = 3;
  ta.placeholder = 'Uw antwoord…';
  ta.addEventListener('input', () => { intake[veld] = ta.value; checkVerzenden(); });
  div.appendChild(ta);
  return div;
}

function maakDropdownvraag(nummer, label, opties, veld) {
  const div = document.createElement('div');
  div.className = 'vraag-blok';
  div.innerHTML = `<div class="vraag-label"><span class="radio-nummer">${nummer}.</span> ${label}</div>`;
  const sel = document.createElement('select');
  sel.className = 'intake-select';
  sel.innerHTML = `<option value="">— Maak een keuze —</option>` +
    opties.map(o => `<option value="${o}">${o}</option>`).join('');
  sel.addEventListener('change', () => { intake[veld] = sel.value; checkVerzenden(); });
  div.appendChild(sel);
  return div;
}

// Radiogroep die de gekozen tekst opslaat (voor Beloop)
function maakRadioTekstvraag(nummer, label, opties, veld) {
  const div = document.createElement('div');
  div.className = 'radio-blok';
  div.innerHTML = `<div class="radio-label"><span class="radio-nummer">${nummer}.</span> ${label}</div>`;
  const rij = document.createElement('div');
  rij.className = 'radio-opties';
  opties.forEach(tekst => {
    const knop = document.createElement('button');
    knop.className = 'radio-knop';
    knop.innerHTML = `<span class="radio-tekst">${tekst}</span>`;
    knop.onclick = () => {
      intake[veld] = tekst;
      rij.querySelectorAll('.radio-knop').forEach(k => k.classList.remove('actief'));
      knop.classList.add('actief');
      checkVerzenden();
    };
    rij.appendChild(knop);
  });
  div.appendChild(rij);
  return div;
}

// Gecombineerde vraag 4+5: hoeveelheid (tekst) + eenheid (dropdown)
function maakDuurVraag(nummer) {
  const div = document.createElement('div');
  div.className = 'vraag-blok';
  div.innerHTML = `<div class="vraag-label"><span class="radio-nummer">${nummer}.</span> Sinds wanneer heeft u last van deze klacht(en)?</div>`;
  const rij = document.createElement('div');
  rij.className = 'duur-rij';

  const input = document.createElement('input');
  input.type = 'number';
  input.min = '1';
  input.className = 'intake-getal';
  input.placeholder = 'bijv. 3';
  input.addEventListener('input', () => { intake.duur_aantal = input.value; checkVerzenden(); });

  const sel = document.createElement('select');
  sel.className = 'intake-select';
  sel.innerHTML = `<option value="">— Eenheid —</option>` +
    INTAKE_EENHEID_OPTIES.map(o => `<option value="${o}">${o}</option>`).join('');
  sel.addEventListener('change', () => { intake.duur_eenheid = sel.value; checkVerzenden(); });

  rij.appendChild(input);
  rij.appendChild(sel);
  div.appendChild(rij);
  return div;
}

function maakSectie(titel, info) {
  const div = document.createElement('div');
  div.className = 'sectie';
  div.innerHTML = `<div class="sectie-header">${titel}</div><p class="sectie-info">${info}</p>`;
  return div;
}

function maakSlider(label, dataArray, index) {
  const div = document.createElement('div');
  div.className = 'vraag-blok';
  div.innerHTML = `
    <div class="vraag-label">${label}</div>
    <div class="slider-rij">
      <span class="slider-min">0</span>
      <input type="range" min="0" max="10" step="1" value="5" class="frm-slider">
      <span class="slider-max">10</span>
      <div class="slider-waarde">—</div>
    </div>`;

  const slider = div.querySelector('.frm-slider');
  const waardeEl = div.querySelector('.slider-waarde');

  const update = () => {
    const v = Number(slider.value);
    if (dataArray === 'pijn') spadiPijn[index] = v;
    else spadiBeperking[index] = v;
    waardeEl.className = 'slider-waarde ingevuld';
    waardeEl.textContent = v;
    checkVerzenden();
  };

  slider.addEventListener('mousedown', update);
  slider.addEventListener('touchstart', update);
  slider.addEventListener('input', update);
  return div;
}

// Horizontale knoppenrij — voor korte optieteksten (QBPDS, QuickDASH)
function maakRadio(nummer, label, optieLabels, setter) {
  const div = document.createElement('div');
  div.className = 'radio-blok';
  div.innerHTML = `<div class="radio-label"><span class="radio-nummer">${nummer}.</span> ${label}</div>`;
  const opties = document.createElement('div');
  opties.className = 'radio-opties';

  optieLabels.forEach((tekst, i) => {
    const knop = document.createElement('button');
    knop.className = 'radio-knop';
    knop.innerHTML = `<span class="radio-score">${i}</span><span class="radio-tekst">${tekst}</span>`;
    knop.onclick = () => {
      setter(i);
      opties.querySelectorAll('.radio-knop').forEach(k => k.classList.remove('actief'));
      knop.classList.add('actief');
    };
    opties.appendChild(knop);
  });
  div.appendChild(opties);
  return div;
}

// Verticale lijst — voor lange optieteksten (NDI: hele zinnen per antwoord)
function maakRadioVerticaal(nummer, label, optieLabels, setter) {
  const div = document.createElement('div');
  div.className = 'radio-blok';
  div.innerHTML = `<div class="radio-label"><span class="radio-nummer">${nummer}.</span> ${label}</div>`;
  const opties = document.createElement('div');
  opties.className = 'radio-opties-verticaal';

  optieLabels.forEach((tekst, i) => {
    const knop = document.createElement('button');
    knop.className = 'radio-knop-rij';
    knop.innerHTML = `<span class="radio-score-klein">${i}</span><span class="radio-tekst-links">${tekst}</span>`;
    knop.onclick = () => {
      setter(i);
      opties.querySelectorAll('.radio-knop-rij').forEach(k => k.classList.remove('actief'));
      knop.classList.add('actief');
    };
    opties.appendChild(knop);
  });
  div.appendChild(opties);
  return div;
}

function checkVerzenden() {
  let klaar = false;
  const lijst = verzoekData.vragenlijst;
  if (lijst === 'SPADI') {
    klaar = spadiPijn.every(v => v !== null) && spadiBeperking.every(v => v !== null);
  } else if (lijst === 'QBPDS') {
    klaar = qbpds.every(v => v !== null);
  } else if (lijst === 'NDI') {
    klaar = ndi.every(v => v !== null);
  } else if (lijst === 'QuickDASH') {
    klaar = quickdash.every(v => v !== null);
  } else if (lijst === 'KOOS-12') {
    klaar = koos.every(v => v !== null);
  } else if (lijst === 'HOOS-12') {
    klaar = hoos.every(v => v !== null);
  } else if (lijst === 'Intake') {
    klaar = intake.klacht_beschrijving.trim() !== '' &&
            intake.beperkingen.trim() !== '' &&
            intake.zijde !== '' &&
            intake.duur_aantal.trim() !== '' &&
            intake.duur_eenheid !== '' &&
            intake.ontstaan.trim() !== '' &&
            intake.beloop !== '' &&
            intake.doel.trim() !== '';
  }
  document.getElementById('verzend-knop').disabled = !klaar;
}

async function verzenden() {
  const knop = document.getElementById('verzend-knop');
  knop.disabled = true;
  knop.textContent = 'Bezig...';

  let scores;
  switch (verzoekData.vragenlijst) {
    case 'SPADI':     scores = { pijn: spadiPijn, beperking: spadiBeperking }; break;
    case 'QBPDS':     scores = { items: qbpds }; break;
    case 'NDI':       scores = { items: ndi }; break;
    case 'QuickDASH': scores = { items: quickdash }; break;
    case 'KOOS-12':   scores = { items: koos }; break;
    case 'HOOS-12':   scores = { items: hoos }; break;
    case 'Intake':    scores = { intake: intake }; break;
    default:          scores = { items: [] };
  }

  try {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/vragenlijsten?id=eq.${verzoekData.id}`,
      {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Prefer': 'return=minimal',
        },
        body: JSON.stringify({ scores, ingevuld_op: new Date().toISOString() }),
      }
    );

    if (!response.ok) throw new Error();

    // Volgende verzoek in de wachtrij, of klaar
    wachtrijIndex++;
    if (wachtrijIndex < verzoekWachtrij.length) {
      document.getElementById('fout').style.display = 'none';
      laadHuidigVerzoek();
    } else {
      toonScherm('dank');
      document.getElementById('progress').style.display = 'none';
    }

  } catch(e) {
    const fout = document.getElementById('fout');
    fout.textContent = 'Er is iets misgegaan. Probeer het opnieuw.';
    fout.style.display = 'block';
    knop.disabled = false;
    knop.textContent = verzoekWachtrij.length > 1
      ? `✓ Verzenden (${wachtrijIndex + 1}/${verzoekWachtrij.length})`
      : '✓ Verzenden';
  }
}

init();
</script>
</body>
</html>
